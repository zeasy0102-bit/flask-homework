
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Page</title>
</head>
<body>
    {% if name %}
        <h1>Hello, {{ name }}!</h1>
        <p>Welcome to our Flask application.</p>
    {% else %}
        <h1>Hello, Guest!</h1>
        <p>No name was provided.</p>
    {% endif %}

    <a href="/">Back to Home</a>
</body>
</html>
